# -----------------------------------------------------------------------------
# CompIntel Web & Reverse Proxy Nginx Configuration (T9.14a)
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name localhost;

    # Gzip compression for performance (PRD NFR-03)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers (OWASP ASVS 9.2.1 / ADR-0008)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://api:8000;" always;

    # Root directory for pre-compiled React SPA static bundle
    root /usr/share/nginx/html;
    index index.html;

    # API Proxy: Route /v1/ requests to backend serving container
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Telemetry Proxy: Route /metrics to backend
    location /metrics {
        proxy_pass http://api:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Healthcheck proxies
    location ~ ^/(healthz|livez|readyz) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static Assets caching (1 year for hashed Vite chunks)
    location ~* \.(?:css|js|woff2|woff|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Client Routing: Fallback all unhandled paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
