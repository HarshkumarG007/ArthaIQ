name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Static analysis -----------------------------------------------------
  static:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: mypy
        run: uv run mypy src/compintel

      - name: import-linter
        run: uv run lint-imports

  # ---- Data Contracts (R-DA-03, R-DA-05, R-DA-07, R-MD-07) -----------------
  contracts:
    name: Data and schema contracts
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run contract tests
        run: uv run pytest tests/contract/ -m "contract"

      - name: Verify database migrations up and down (T9.06)
        run: |
          uv run alembic upgrade head --sql > /dev/null
          uv run alembic downgrade 0001_initial_governance:base --sql > /dev/null
          uv run pytest tests/integration/test_migrations.py

      - name: Verify WCAG 2.2 token contrast (T9.07)
        run: uv run python scripts/check_contrast.py

  # ---- Frontend (T9.07, ADR-0007) -------------------------------------------
  frontend:
    name: Frontend foundation and tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify WCAG 2.2 token contrast
        run: uv run python scripts/check_contrast.py

      - name: Verify self-hosted fonts (Rupee sign, tabular figures, OFL)
        run: |
          uv run python scripts/verify_fonts.py
          uv run pytest tests/unit/test_verify_fonts.py

      - name: Run web unit and formatting tests
        working-directory: apps/web
        run: npm run test

      - name: Build web production bundle (Vite)
        working-directory: apps/web
        run: npm run build

  # ---- Tests ----------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [static, contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run tests
        run: uv run pytest tests/ -m "not e2e and not slow" --cov=src/compintel --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  # ---- Security -------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit dependencies (pip-audit)
        run: |
          uv export --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uv run --with pip-audit pip-audit -r requirements-audit.txt
          rm requirements-audit.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
