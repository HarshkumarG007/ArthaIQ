# .pre-commit-config.yaml — CompIntel
# Hooks are verified and updated at T3.01/T3.02 (ADR-0003).
# Run `make install-hooks` once after cloning.

repos:
  # ---- Ruff (lint and format) -----------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---- mypy (type checking on staged files in src/compintel) ---------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/compintel/
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2
          - pydantic-settings>=2
          - types-PyYAML

  # ---- Secret scanning ------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # ---- Notebook output stripping (R-CD-04) ----------------------------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # ---- Large file guard -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace


  # ---- Conventional commit message lint -------------------------------------
  # (Optional; add if you want enforced commit message format)
  # - repo: https://github.com/compilerla/conventional-pre-commit
  #   rev: v3.2.0
  #   hooks:
  #     - id: conventional-pre-commit
  #       stages: [commit-msg]
