# =============================================================================
#  ArthaIQ -- Advanced Modeling Experiment Charter: Survival & Tenure Models
#  File: experiments/configs/charters/charter_survival_models.yaml
#  Task: T7.01 (PRD Sec 5, FR-05, Rules R-MD-01, R-MD-05, R-MD-09, R-CD-01)
# =============================================================================

charter_id: "CHARTER-SURVIVAL-MODELS"
experiment_id: "EXP-SURV-01"
title: "Parametric & Semi-Parametric Survival Models for Compensation Progression & Stagnation"
task_id: "T7.01"
governing_rules:
  - "R-MD-01"  # Orderly ladder climbing & bootstrap CI
  - "R-MD-05"  # Comprehensive evaluation metrics
  - "R-MD-09"  # Charter required for non-standard model families
  - "R-CD-01"  # Pure typed Python, CPU-only inference, reproducible seeds
priority_rank: 6
expected_value: "LOW"
computational_cost: "MEDIUM"
operational_feasibility: "CONDITIONALLY_FEASIBLE"

candidate_summary:
  hypothesis: >
    Right-censored survival analysis (Cox Proportional Hazards / Weibull Accelerated
    Failure Time) on tenure-at-level explicitly models promotion hazard and compensation
    plateau risks, providing a better foundation for forward compensation projections
    than static cross-sectional regression.
  baseline_champion: "Rung F Conformal CatBoost"
  proposed_variants:
    - name: "variant_a_weibull_aft"
      description: "Weibull Accelerated Failure Time model on duration-at-current-compensation"
      compute_type: "scipy.optimize MLE Weibull fit"
    - name: "variant_b_cox_ph"
      description: "Semi-parametric Cox Proportional Hazards model on promotion duration"
      compute_type: "Breslow estimator on CPU"

evaluation_protocol:
  dataset_snapshot_id: "SNAP-1FF34A8E9633"
  split_protocol: "grouped_temporal_select"
  evaluation_partition: "select"
  seed: 42
  bootstrap_resamples: 1000
  confidence_level: 0.95

keep_criteria:
  primary_metric_threshold:
    metric: "delta_mean_pinball_loss"
    direction: "decrease"
    min_effect_size_lpa: -0.050
    confidence_interval: "95% bootstrap CI upper bound must be < 0.0"
  secondary_metric_thresholds:
    concordance_index_min: 0.70
    brier_score_max: 0.15

reject_criteria:
  - "delta_mean_pinball_loss > -0.050 LPA"
  - "95% bootstrap CI includes 0.0"
  - "Current cross-sectional data lacks right-censoring duration indicators (tenure start date and exit date)"
  - "Model cannot output valid P10, P50, P90 guaranteed cash intervals conforming to PRD FR-01"

defer_criteria:
  - "Requires longitudinal multi-event career tracking; deferred to future career trajectory feature roadmap"

decision_authority: "Phase 7 Gate G7 Human Reviewer & AI Assistant"
