#  File: experiments/configs/charters/charter_exp10r_v2.yaml
#  Task: T14.03 (PRD Sec 5, FR-05, Rules R-MD-01, R-MD-03, R-MD-09, R-DA-10)
# =============================================================================

charter_id: "CHARTER-EXP-10r-v2"
experiment_id: "EXP-10r-v2"
title: "Employer Graph Feasibility Re-audit under B2B Syndication Data Tranches"
task_id: "T14.03"
governing_rules:
  - "R-MD-01"  # Orderly ladder climbing & bootstrap CI
  - "R-MD-03"  # Grouped-temporal isolation & strict graph leakage prevention
  - "R-MD-09"  # Charter required for employer graphs / GNNs before implementation
  - "R-DA-10"  # k_min >= 5 anonymity floor on employer clusters
  - "R-CD-01"  # Pure typed Python, CPU-only inference, reproducible seeds
priority_rank: 9
expected_value: "HIGH"
computational_cost: "MEDIUM"
operational_feasibility: "FEASIBLE"

candidate_summary:
  hypothesis: >
    B2B enterprise HRIS syndication (SRC-B2B-01) supplies dense cross-employer mobility
    and verified employer cluster transitions, overcoming the sparsity bottleneck of PT1
    (< 50 nodes). Spectral talent-flow embeddings on k_min >= 5 anonymized clusters can
    now provide statistically significant pinball loss reduction without temporal leakage.
  baseline_champion: "Rung F Conformal CatBoost with discrete employer tier + k_min >= 5 cluster floor"
  proposed_variants:
    - name: "variant_a_syndicated_cluster_target_encoding"
      description: "Out-of-fold leave-one-out smoothed target encoding of syndicated employer clusters with k_min >= 5 floor"
      compute_type: "Deterministic grouped statistics"
    - name: "variant_b_syndicated_talent_flow_graph_embedding"
      description: "Spectral / Node2Vec transition graph embedding on historical co-hiring graph constructed strictly as-of train_end cutoff"
      compute_type: "NetworkX / scipy sparse spectral decomposition on CPU"

evaluation_protocol:
  dataset_snapshot_id: "SNAP-B2B-PHASE14"
  split_protocol: "grouped_temporal_select"
  evaluation_partition: "select"
  seed: 42
  bootstrap_resamples: 1000
  confidence_level: 0.95

keep_criteria:
  primary_metric_threshold:
    metric: "delta_mean_pinball_loss"
    direction: "decrease"
    min_effect_size_lpa: -0.050
    confidence_interval: "95% bootstrap CI upper bound must be < 0.0"
  secondary_metric_thresholds:
    mdape_reduction_pp: 2.0
    coverage_tolerance: [0.72, 0.88]
    crossing_rate_max: 0.005
    width_ratio_vs_champion_max: 1.00
  leakage_and_privacy_gates:
    graph_temporal_isolation: "Graph edges must contain ONLY transitions occurring before train_cutoff_date"
    anonymization_floor: "All graph nodes must meet k_min >= 5 distinct observations (Rule R-DA-10)"
    p95_inference_latency_ms: 30.0

reject_criteria:
  - "delta_mean_pinball_loss > -0.050 LPA"
  - "95% bootstrap CI includes 0.0"
  - "Transition graph contains temporal leakage across train -> select boundary"
  - "Graph contains isolated nodes or employer identities with < 5 distinct individuals"
  - "Inference requires online graph traversal or heavy GNN runtime"

defer_criteria:
  - "Syndicated tranche coverage has < 100 enterprise employers with >= 5 verified transitions"
  - "CCI multi-employer safe harbor not fulfilled across reporting cells"

decision_authority: "Phase 14 Gate G14 Technical Reviewer & Governance Lead"
