# =============================================================================
#  ArthaIQ -- Advanced Modeling Experiment Charter: EXP-09
#  File: experiments/configs/charters/charter_exp09_skills_embeddings.yaml
#  Task: T7.01, T7.02 (PRD Sec 5, FR-05, Rules R-MD-01, R-MD-05, R-MD-09, R-CD-01)
# =============================================================================

charter_id: "CHARTER-EXP-09"
experiment_id: "EXP-09"
title: "Skills Feature Modeling: Curated Taxonomy & TF-IDF vs Sentence-Transformer Embeddings on CPU"
task_id: "T7.02"
governing_rules:
  - "R-MD-01"  # Orderly ladder climbing & bootstrap CI
  - "R-MD-05"  # Comprehensive evaluation metrics
  - "R-MD-09"  # Charter required for embeddings / text models before implementation
  - "R-CD-01"  # Pure typed Python, CPU-only inference, reproducible seeds
  - "R-DA-10"  # Privacy & k_min protection
priority_rank: 1
expected_value: "MEDIUM"
computational_cost: "MEDIUM_HIGH"
operational_feasibility: "FEASIBLE"

candidate_summary:
  hypothesis: >
    Dense semantic representations derived from lightweight sentence-transformer
    embeddings (e.g. all-MiniLM-L6-v2 / static token vectors) or n-gram TF-IDF on
    standardized skill strings capture nuanced skill synergy and premium better
    than a discrete one-hot curated taxonomy, yielding a statistically significant
    reduction in mean pinball loss without violating CPU inference budgets.
  baseline_champion: "Rung F Conformal CatBoost on L2 features (no text embeddings)"
  proposed_variants:
    - name: "variant_a_curated_taxonomy_tfidf"
      description: "Standardized skill bag representation with TF-IDF weighting and SVD/PCA dimensionality reduction (k=8)"
      compute_type: "scikit-learn TfidfVectorizer + TruncatedSVD (CPU-native, zero extra dependency)"
    - name: "variant_b_sentence_transformer_cpu"
      description: "Dense 384-d semantic embedding from compact CPU sentence-transformer projected to top 8 orthogonal components"
      compute_type: "Quantized/ONNX/PyTorch CPU-only sentence encoder"

evaluation_protocol:
  dataset_snapshot_id: "SNAP-1FF34A8E9633"
  split_protocol: "grouped_temporal_select"
  evaluation_partition: "select"
  seed: 42
  bootstrap_resamples: 1000
  confidence_level: 0.95

keep_criteria:
  primary_metric_threshold:
    metric: "delta_mean_pinball_loss"
    direction: "decrease"
    min_effect_size_lpa: -0.050
    confidence_interval: "95% bootstrap CI upper bound must be < 0.0"
  secondary_metric_thresholds:
    mdape_reduction_pp: 2.0
    coverage_tolerance: [0.72, 0.88]
    crossing_rate_max: 0.005
    width_ratio_vs_champion_max: 1.00
  latency_and_budget_gates:
    p95_inference_latency_ms: 50.0  # Must fit within 200ms overall request budget
    max_memory_footprint_mb: 250.0
    max_bundle_size_mb: 80.0
    device_constraint: "CPU only (x86_64, zero GPU dependency)"

reject_criteria:
  - "delta_mean_pinball_loss > -0.050 LPA (effect size insufficient per R-MD-01)"
  - "95% bootstrap CI of delta_mean_pinball_loss includes 0.0 (statistically indistinguishable)"
  - "Inference latency on Profile B workstation exceeds 50.0 ms p95"
  - "Model bundle artifact size exceeds 100 MB or requires unpinned remote model downloads"
  - "Quantile crossing rate exceeds 0.5% (violation of R-UQ-05)"

defer_criteria:
  - "Improvement is marginal (-0.050 < delta <= -0.010 LPA) but skill corpus in PT1 has < 50 unique skill phrases"
  - "Deferred to primary data acquisition tranche (SRC-INT-VOL-01 scale-up) when detailed skill itemization is available"

decision_authority: "Phase 7 Gate G7 Human Reviewer & AI Assistant"
