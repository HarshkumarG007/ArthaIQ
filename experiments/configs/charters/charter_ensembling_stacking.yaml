# =============================================================================
#  ArthaIQ -- Advanced Modeling Experiment Charter: Ensembling & Stacking
#  File: experiments/configs/charters/charter_ensembling_stacking.yaml
#  Task: T7.01, T7.06 (PRD Sec 5, FR-05, Rules R-MD-01, R-MD-05, R-MD-09, R-UQ-05)
# =============================================================================

charter_id: "CHARTER-ENSEMBLING-STACKING"
experiment_id: "EXP-ENSEMBLE-01"
title: "Model Ensembling & Quantile Stacking: Blending Gradient Boosting & Hierarchical Bayes"
task_id: "T7.06"
governing_rules:
  - "R-MD-01"  # Orderly ladder climbing & bootstrap CI
  - "R-MD-05"  # Comprehensive evaluation metrics
  - "R-MD-09"  # Charter required for ensembling architectures
  - "R-UQ-05"  # Strict zero quantile crossing enforcement
  - "R-CD-01"  # Pure typed Python, CPU-only inference, reproducible seeds
priority_rank: 5
expected_value: "LOW_MEDIUM"
computational_cost: "HIGH"
operational_feasibility: "FEASIBLE"

candidate_summary:
  hypothesis: >
    A convex combination / meta-learner stacking of diverse quantile predictors
    (Rung F CatBoost CQR + Rung E LightGBM MultiQuantile + Rung C Hierarchical Bayes)
    with non-crossing monotonic isotonic projection reduces pinball variance and
    sharpens prediction intervals compared to any single individual champion model.
  baseline_champion: "Rung F Conformal CatBoost"
  proposed_variants:
    - name: "variant_a_weighted_quantile_blend"
      description: "Loss-weighted convex blend of CatBoost and LightGBM quantiles with Chernozhukov monotonic rearrangement"
      compute_type: "Convex combination + isotonic sort"
    - name: "variant_b_stacked_conformal_meta_learner"
      description: "Ridge quantile meta-regressor trained on out-of-fold calibration predictions with conformalized residual intervals"
      compute_type: "Cross-validated meta-regression"

evaluation_protocol:
  dataset_snapshot_id: "SNAP-1FF34A8E9633"
  split_protocol: "grouped_temporal_select"
  evaluation_partition: "select"
  seed: 42
  bootstrap_resamples: 1000
  confidence_level: 0.95

keep_criteria:
  primary_metric_threshold:
    metric: "delta_mean_pinball_loss"
    direction: "decrease"
    min_effect_size_lpa: -0.050
    confidence_interval: "95% bootstrap CI upper bound must be < 0.0"
  secondary_metric_thresholds:
    mdape_reduction_pp: 2.0
    coverage_tolerance: [0.72, 0.88]
    crossing_rate_max: 0.005
    width_ratio_vs_champion_max: 0.95  # Must achieve >= 5% interval width reduction to justify multi-model overhead
  operational_complexity_gates:
    max_inference_latency_multiplier: 1.50  # Must not exceed 1.5x single model latency
    max_bundle_size_mb: 100.0
    zero_crossing_guarantee: "Rearrangement step must guarantee 0.00% crossing rate"

reject_criteria:
  - "delta_mean_pinball_loss > -0.050 LPA"
  - "95% bootstrap CI includes 0.0"
  - "Complexity overhead (training 3 models, debugging multi-model failures) outweighs marginal metric gain"
  - "Ensemble width reduction is < 5% compared to single champion"

defer_criteria:
  - "Single champion Rung F already satisfies all PRD targets; ensembling reserved for Kaggle-style competitions rather than robust production systems"

decision_authority: "Phase 7 Gate G7 Human Reviewer & AI Assistant"
