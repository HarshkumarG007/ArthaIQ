metadata:
  document_id: "experiments/preregistration/sufficiency-v1.yaml"
  version: "1.0.0"
  status: "LOCKED_ON_FIRST_PROFILING_RUN"
  authored_task: "T2.01"
  authored_date: "2026-10-13"
  locked_date: null
  locked_commit: null
  governing_documents:
    - "docs/research/01-targets.md"
    - "docs/research/02-comp-definitions.md"
    - "docs/research/05-source-scoring.md"
    - "docs/research/08-scope-memo.md"
    - "docs/adr/ADR-0001-initial-market-and-occupation-scope.md"
