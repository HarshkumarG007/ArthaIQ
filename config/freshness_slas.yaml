# =============================================================================
#  ArthaIQ -- Source Freshness Service Level Agreements (SLAs) & Cadences
#  File: config/freshness_slas.yaml
# =============================================================================
#
#  IMMUTABILITY & GOVERNANCE CONTRACT (PRD NFR-11, RSK-11, Rule R-DA-01, ADR-0005)
#  This file defines the maximum allowed observation age (SLA in days), expected
#  refresh cadence, automated ingestion capabilities, and operational response
#  actions for every approved data source in ArthaIQ.
#
#  Threshold Rules:
#  - Age < (0.75 * SLA): FRESH (Normal operation)
#  - (0.75 * SLA) <= Age < SLA: WARNING (Approaching staleness alert)
#  - Age >= SLA: STALE (CRITICAL alert dispatched, estimates marked guarded/stale)
# =============================================================================

version: "1.0.0"
effective_date: "2026-10-21"
status: "ACTIVE"

sources:
  SRC-INT-VOL-01:
    name: "ArthaIQ Voluntary Intake Submissions"
    sla_days: 30.0
    refresh_cadence: "daily"
    description: "Direct verified itemized compensation from user submissions. High frequency rolling stream."
    auto_refreshable: true
    staleness_action: "Trigger CRITICAL alert; flag ingestion stall; inspect API intake pipeline."

  SRC-SUP-MAC-01:
    name: "RBI DBIE Macro Indices (CPI & FX)"
    sla_days: 45.0
    refresh_cadence: "monthly"
    description: "Monthly CPI-Urban deflator and daily USD/INR exchange rate series."
    auto_refreshable: true
    staleness_action: "Trigger CRITICAL alert; freeze deflation adjustments to latest valid CPI index."

  SRC-IND-OFF-03:
    name: "EPFO Monthly Payroll Microdata"
    sla_days: 60.0
    refresh_cadence: "monthly"
    description: "Formal sector employment and net payroll addition reports published monthly by EPFO."
    auto_refreshable: false
    staleness_action: "Trigger CRITICAL alert; notify data engineering to ingest latest statutory bulletin."

  SRC-USA-DOL-01:
